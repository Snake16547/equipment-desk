services:
  equipment-desk:
    image: ${EQUIPMENT_DESK_IMAGE:-YOUR_DOCKERHUB_USERNAME/equipment-desk:0.2.0}
    container_name: equipment-desk
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_FILE: /data/equipment.json
    ports:
      - "8088:8000"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
