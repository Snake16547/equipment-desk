<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Equipment Desk</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="kiosk"><main class="wrap">
<header class="top"><div><div class="eyebrow">SELF-SERVICE EQUIPMENT</div><h1>Equipment Desk</h1></div><a class="admin-link" href="/admin">Admin</a></header>
<section id="home" class="panel"><h2>Welcome!</h2><p class="muted">What would you like to do?</p><div class="big-actions"><button class="big green" onclick="start('checkout')"><span>＋</span>CHECK OUT<small>Take equipment</small></button><button class="big blue" onclick="start('checkin')"><span>↩</span>CHECK IN<small>Return equipment</small></button></div><h3>Currently available</h3><div id="availability" class="availability"></div></section>
<section id="flow" class="panel hidden"><button class="back" onclick="goHome()">← Back</button><h2 id="flowTitle"></h2><div id="savedPeopleWrap" class="subpanel hidden"><label>Regular borrower<select id="savedPerson" onchange="chooseSavedPerson(this.value)"><option value="">Enter details manually</option></select></label></div><div class="form-grid"><label>First name<input id="first" autocomplete="given-name" maxlength="60"></label><label>Last name<input id="last" autocomplete="family-name" maxlength="60"></label><label class="wide">Phone number<input id="phone" type="tel" autocomplete="tel" placeholder="+1 202 555 0100" maxlength="40"></label><label id="projectWrap" class="wide">Project / production (optional)<input id="project" maxlength="120"></label></div><div id="selection"></div><button id="continue" class="primary full" onclick="continueFlow()">Continue</button><div id="flowError" class="error"></div></section>
<section id="confirm" class="panel hidden"><button class="back" onclick="backToFlow()">← Back</button><h2>Confirm your action</h2><div id="summary"></div><button class="primary full" onclick="submitFlow()">Confirm</button><div id="confirmError" class="error"></div></section>
<section id="done" class="panel hidden center"><div class="done-icon">✓</div><h2>All set!</h2><p id="doneMessage" class="muted">Your transaction has been recorded.</p><button class="primary full" onclick="goHome()">Back to start</button></section>
<footer>Equipment Desk · Please return everything promptly.</footer></main><script src="/static/kiosk.js"></script></body></html>
