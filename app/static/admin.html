<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Equipment Desk Admin</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="wrap admin-wrap"><header class="top"><div><div class="eyebrow">EQUIPMENT DESK</div><h1>Administration</h1></div><a class="admin-link" href="/">← Kiosk</a></header>
<section id="login" class="panel"><h2>Admin login</h2><p class="muted">Enter your administrator password.</p><form onsubmit="login(event)" class="admin-form"><label class="wide">Password<input id="loginPass" type="password" autocomplete="current-password" required></label><button class="primary wide">Sign in</button></form><div id="loginError" class="error"></div></section>
<div id="app" class="hidden"><section class="panel"><div class="tabs"><button class="tab active" data-tab="dashboard" onclick="tab('dashboard')">Dashboard</button><button class="tab" data-tab="equipment" onclick="tab('equipment')">Equipment</button><button class="tab" data-tab="people" onclick="tab('people')">People</button><button class="tab" data-tab="loans" onclick="tab('loans')">Checked out</button><button class="tab" data-tab="activity" onclick="tab('activity')">Activity log</button><button class="tab" data-tab="settings" onclick="tab('settings')">Settings & email</button></div><div id="content"></div></section><button class="small-btn" onclick="logout()">Sign out</button></div></main><script src="/static/admin.js"></script></body></html>
